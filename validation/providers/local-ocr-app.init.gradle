// One explicitly selected offline debug candidate; never configure silently or use for a release task.
import java.util.concurrent.TimeUnit
import org.gradle.api.artifacts.verification.DependencyVerificationMode

def folder = System.getProperty("pristinepage.ocrLocalApp")
def selected = gradle.startParameter
def appOnly = [":app:assembleDebug"]
def appAndTest = [":app:assembleDebug", ":app:assembleDebugAndroidTest"]
if (folder == null || folder.isBlank() || !selected.offline
        || selected.dependencyVerificationMode != DependencyVerificationMode.STRICT
        || !(selected.taskNames in [appOnly, appAndTest])) {
    throw new GradleException("Local app OCR requires the debug app task (optionally its paired instrumentation), strict offline verification, and an exact local stage")
}

gradle.settingsEvaluated { settings ->
    File root = settings.settingsDir
    File stage = new File(folder).absoluteFile
    File allowed = new File(root, "validation/raw/providers").canonicalFile
    if (stage.canonicalFile != stage || stage.parentFile != allowed || !(stage.name ==~ /ocr-app-[a-z0-9-]+/)) {
        throw new GradleException("The local OCR app must use an ignored, scoped stage")
    }
    def verifier = new File(root, "validation/providers/prepare_ocr_local_app.py")
    def check = new ProcessBuilder("python", "-B", verifier.path, stage.path).redirectErrorStream(true).start()
    if (!check.waitFor(30, TimeUnit.SECONDS)) {
        check.destroyForcibly()
        throw new GradleException("Local OCR staging verification exceeded its time limit")
    }
    if (check.exitValue() != 0) throw new GradleException("Unverified local OCR stage")

    gradle.beforeProject { project ->
        if (project.path == ":app") project.plugins.withId("com.android.application") {
            def android = project.extensions.getByName("android")
            def source = android.sourceSets.getByName("debug")
            source.java.srcDir(new File(root, "validation/providers/ocr-local-app/application"))
            source.assets.srcDir(new File(stage, "assets"))
            project.dependencies.add("debugImplementation", project.files(new File(stage, "tesseract4android.aar")))
            // Apply after the project's normal debug DSL, before AGP creates the selected variant.
            project.extensions.getByName("androidComponents").finalizeDsl { dsl ->
                def debug = dsl.buildTypes.getByName("debug")
                debug.manifestPlaceholders.put("pristinePageApplication", "app.pristinepage.LocalOcrApplication")
                debug.versionNameSuffix = "-debug-ocr-local"
            }
        }
        if (project.path == ":image-android") project.plugins.withId("com.android.library") {
            def source = project.extensions.getByName("android").sourceSets.getByName("debug")
            source.java.srcDir(new File(root, "validation/providers/tesseract-runtime"))
            source.java.srcDir(new File(root, "validation/providers/ocr-local-app/image"))
            source.java.srcDir(new File(stage, "catalog"))
            // AGP library projects cannot package a file AAR. Compile against the verified classes from that same AAR; the app carries the actual runtime.
            project.dependencies.add("debugCompileOnly", project.files(new File(stage, "classes.jar")))
        }
    }
}
